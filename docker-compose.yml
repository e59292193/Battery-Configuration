services:
  web:
    build: .
    container_name: battery-configuration
    ports:
      - "3000:3000"
    environment:
      # 也可以用 env_file 引入 .env；此处透传宿主机环境变量，缺省为空
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - PORT=3000
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - RATE_LIMIT=${RATE_LIMIT:-30}
    restart: unless-stopped
